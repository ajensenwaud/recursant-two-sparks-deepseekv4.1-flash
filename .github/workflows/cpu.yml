name: CPU recipe checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python standard-library tests (no GPU, installs or model download)
        run: python3 -B -m unittest discover -s tests -v
      - name: Entry-point syntax and side-effect-free help
        run: |
          bash -n start.sh stop.sh status.sh
          ./start.sh --help
          ./stop.sh --help
          ./status.sh --help
      - name: Check pinned build and download plans
        run: |
          python3 -B scripts/build.py --dry-run
          python3 -B scripts/download.py --dry-run
          python3 -B scripts/cluster.py plan --config configs/cluster.example.json
